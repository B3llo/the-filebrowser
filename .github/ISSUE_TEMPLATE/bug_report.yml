name: Bug Report
description: Report a bug in FileBrowser.
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Checklist
      description: Please verify that you've followed these steps
      options:
        - label: This is a bug report, not a question or a feature request.
          required: true
        - label: I searched the issue tracker and this is not a duplicate.
          required: true
        - label: I am running a recent build (latest release or master).
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `filebrowser version`, or the Docker image tag you run.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, and how it runs (binary, Docker, reverse proxy, …).
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: Only what you observed. Keep diagnosis out of this field.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps someone starting from scratch can follow.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: diagnosis
    attributes:
      label: Your diagnosis (optional)
      description: If you investigated, separate what you observed from what you infer.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: Text
    validations:
      required: false
