name: Deploy Docker Image

# Publishes a test image of one commit under an explicit tag, from any branch.
# `latest` is never written here: releases own it (GoReleaser publishes it on
# v* tags), so a branch build cannot silently replace the stable image.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish. Empty = sha-<short commit>. 'latest' is refused."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  verify-ci:
    name: Verify CI Green
    runs-on: ubuntu-latest
    steps:
      # Only publish a commit that has a successful Continuous Integration run
      # (CI must be green on the exact SHA being deployed).
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          successes=$(gh api \
            "repos/$REPO/actions/workflows/ci.yaml/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$successes" -eq 0 ]; then
            echo "::error::No successful CI run for commit $SHA - refusing to build."
            exit 1
          fi
          echo "CI is green for $SHA."

  docker:
    name: Build & Push
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-sha-${GITHUB_SHA::7}}"
          if [ "$tag" = "latest" ]; then
            echo "::error::'latest' is owned by releases; pick another tag."
            exit 1
          fi
          # Docker tag grammar: [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}
          if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Image tag: $tag" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X github.com/B3llo/the-filebrowser/version.CommitSHA=${GITHUB_SHA::7}" \
            -o filebrowser .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/the-filebrowser:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
