name: Deploy Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-ci:
    name: Verify CI Green
    runs-on: ubuntu-latest
    steps:
      # The image is published as `latest`, so refuse to build a commit that
      # has no successful Continuous Integration run (CI must be green on the
      # exact SHA being deployed).
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          successes=$(gh api \
            "repos/$REPO/actions/workflows/ci.yaml/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$successes" -eq 0 ]; then
            echo "::error::No successful CI run for commit $SHA - refusing to build."
            exit 1
          fi
          echo "CI is green for $SHA."

  docker:
    name: Build & Push
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags='-s -w' -o filebrowser .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/the-filebrowser:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
